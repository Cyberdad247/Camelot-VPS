[package]
name = "camelot-knight"
version = "0.1.0"
edition = "2021"

[dependencies]
camelot-crypto = { path = "../camelot-crypto" }
base64 = "0.22"
chrono = { version = "0.4.34", features = ["serde"] }
ed25519-dalek = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
hex = "0.4"
uuid = { version = "1.7", features = ["v4", "serde"] }
