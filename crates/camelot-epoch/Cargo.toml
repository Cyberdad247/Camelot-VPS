[package]
name = "camelot-epoch"
version = "0.1.0"
edition = "2021"

[dependencies]
camelot-crypto = { path = "../camelot-crypto" }
chrono = { version = "0.4.34", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
