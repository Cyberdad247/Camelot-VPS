[package]
name = "node-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
camelot-vfs = { path = "../../crates/camelot-vfs" }
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.7", features = ["v4"] }
wasmtime = "18.0.0"
wasmtime-wasi = "18.0.0"
