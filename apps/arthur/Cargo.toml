[package]
name = "arthur"
version = "0.1.0"
edition = "2021"

[dependencies]
camelot-crypto = { path = "../../crates/camelot-crypto" }
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.34", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.7", features = ["v4", "serde"] }
