[package]
name = "vfs-guardian"
version = "0.1.0"
edition = "2021"

[dependencies]
camelot-crypto = { path = "../../crates/camelot-crypto" }
camelot-epoch = { path = "../../crates/camelot-epoch" }
camelot-vfs = { path = "../../crates/camelot-vfs" }
camelot-lease = { path = "../../crates/camelot-lease" }
axum = "0.7"
tokio = { version = "1.36", features = ["full", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.7", features = ["v4"] }
