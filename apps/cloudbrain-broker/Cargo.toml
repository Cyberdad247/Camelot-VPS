[package]
name = "cloudbrain-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
camelot-cloudbrain = { path = "../../crates/camelot-cloudbrain" }
camelot-crypto = { path = "../../crates/camelot-crypto" }
camelot-epoch = { path = "../../crates/camelot-epoch" }
camelot-lease = { path = "../../crates/camelot-lease" }
camelot-receipts = { path = "../../crates/camelot-receipts" }
axum = "0.7"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.7", features = ["v4", "serde"] }
subtle = "2.6"
