name: Telemetry Envelope Gate

on:
  pull_request:
    paths:
      - "crates/camelot-telemetry/**"
      - "contracts/v3/telemetry-envelope.schema.json"
      - "Cargo.toml"
      - ".github/workflows/telemetry-envelope.yml"
  push:
    branches:
      - "reforge/helios/ops/**"
    paths:
      - "crates/camelot-telemetry/**"
      - "contracts/v3/telemetry-envelope.schema.json"
      - "Cargo.toml"
      - ".github/workflows/telemetry-envelope.yml"

permissions:
  contents: read

jobs:
  telemetry-envelope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --package camelot-telemetry -- --check
      - name: Check
        run: cargo check -p camelot-telemetry
      - name: Test
        run: cargo test -p camelot-telemetry
      - name: Clippy
        run: cargo clippy -p camelot-telemetry --all-targets -- -D warnings
      - name: Validate telemetry contract
        run: jq empty contracts/v3/telemetry-envelope.schema.json
