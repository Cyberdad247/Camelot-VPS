name: Cloudbrain NotebookLM Integration Gate

on:
  pull_request:
    paths:
      - 'apps/cloudbrain-broker/**'
      - 'crates/camelot-cloudbrain/**'
      - 'apps/sentinel/**'
      - 'contracts/actor.schema.json'
      - 'contracts/context-packet.schema.json'
      - 'infra/systemd/cloudbrain-broker.service'
      - 'infra/systemd/notebooklm-mcp.service'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/cloudbrain-notebooklm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudbrain-contract-and-runtime:
    name: Governed Cloudbrain Broker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check --package camelot-cloudbrain --package cloudbrain-broker --package sentinel
      - name: Check
        run: cargo check --package camelot-cloudbrain --package cloudbrain-broker --package sentinel
      - name: Test
        run: cargo test --package camelot-cloudbrain --package cloudbrain-broker --package sentinel
      - name: Clippy
        run: cargo clippy --package camelot-cloudbrain --package cloudbrain-broker --package sentinel --all-targets -- -D warnings
      - name: Validate contracts
        run: jq empty contracts/actor.schema.json contracts/context-packet.schema.json
