name: Runtime Authority Handoff Gate

on:
  pull_request:
    paths:
      - 'apps/receipt-service/**'
      - 'crates/camelot-crypto/**'
      - 'crates/camelot-epoch/**'
      - 'crates/camelot-receipts/**'
      - 'contracts/authority-epoch.schema.json'
      - 'contracts/receipt.schema.json'
      - 'infra/systemd/receipt-service.service'
      - '.github/workflows/runtime-authority-handoff.yml'
  push:
    branches:
      - 'reforge/runtime-authority-handoff-v1'

permissions:
  contents: read

concurrency:
  group: runtime-authority-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt-epoch-boundary:
    name: Receipt Epoch Admission Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format scoped packages
        run: cargo fmt --package camelot-crypto --package camelot-epoch --package camelot-receipts --package receipt-service -- --check

      - name: Check scoped packages
        run: cargo check -p camelot-crypto -p camelot-epoch -p camelot-receipts -p receipt-service

      - name: Test scoped packages
        run: cargo test -p camelot-crypto -p camelot-epoch -p camelot-receipts -p receipt-service

      - name: Clippy scoped packages
        run: cargo clippy -p camelot-crypto -p camelot-epoch -p camelot-receipts -p receipt-service --all-targets -- -D warnings

      - name: Validate receipt and epoch contracts
        run: jq empty contracts/receipt.schema.json contracts/authority-epoch.schema.json
